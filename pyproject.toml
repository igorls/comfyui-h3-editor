[project]
name = "comfyui-h3-editor"
description = "A timeline video editor for MiniMax H3 inside ComfyUI: write shots, render them, and cut them together with sound. With H3 Take, a node for one shot with pinned frames, references and held video or sound."
version = "0.3.0"
license = { file = "LICENSE" }
dependencies = ["imageio-ffmpeg>=0.5", "gguf>=0.13.0"]

[project.urls]
Homepage = "https://igorls.github.io/comfyui-h3-editor/"
Repository = "https://github.com/igorls/comfyui-h3-editor"

[tool.comfy]
# Set to the publisher made on registry.comfy.org before publishing.
PublisherId = ""
DisplayName = "H3 Editor"
Icon = ""
